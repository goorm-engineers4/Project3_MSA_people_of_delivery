server:
  port: 8011

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always     # 상세 정보 표시
  health:
    db:
      enabled: false           # DB 체크 비활성화
    redis:
      enabled: false


spring:
  application:
    name: module-common

  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true


  spring:
    batch:
      job:
        enabled: false


  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  cloud:
    config:
      enabled: false

  config:
    activate:
      on-profile: msk
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: "software.amazon.msk.auth.iam.IAMLoginModule required;"
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
      # (선택) 네트워크 튜닝
      request.timeout.ms: 30000
      retry.backoff.ms: 1000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      properties:
        linger.ms: 10
    consumer:
      group-id: module-common-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# 앱 전용(토픽 이름) — 기존 키 유지
kafka:
  topics:
    orderEvents: order.events.v1
    orderCommands: order.commands.v1
    inventoryEvents: inventory.events.v1
    inventoryCommands: inventory.commands.v1
    paymentEvents: payment.events.v1
    paymentCommands: payment.commands.v1

    orderEventsDLQ: order.events.dlq.v1
    orderCommandsDLQ: order.commands.dlq.v1
    inventoryEventsDLQ: inventory.events.dlq.v1
    inventoryCommandsDLQ: inventory.commands.dlq.v1
    paymentEventsDLQ: payment.events.dlq.v1
    paymentCommandsDLQ: payment.commands.dlq.v1

# DLQ 모니터링 설정
app:
  dlq:
    monitor:
      enabled: true
      alert-threshold: 1  # 1개 이상 발생하면 즉시 알림
      alert-interval-ms: 30000  # 30초 간격으로 알림

alert:
  discord:
    webhookUrl: ${DISCORD_WEBHOOK}

