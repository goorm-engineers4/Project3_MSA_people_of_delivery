
server:
  port: 8011

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false
    redis:
      enabled: false

spring:
  application:
    name: module-common

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  batch:
    job:
      enabled: false

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  cloud:
    config:
      enabled: false

kafka:
  topics:
    orderEvents: order.events.v1
    orderCommands: order.commands.v1
    inventoryEvents: inventory.events.v1
    inventoryCommands: inventory.commands.v1
    paymentEvents: payment.events.v1
    paymentCommands: payment.commands.v1
    orderEventsDLQ: order.events.dlq.v1
    orderCommandsDLQ: order.commands.dlq.v1
    inventoryEventsDLQ: inventory.events.dlq.v1
    inventoryCommandsDLQ: inventory.commands.dlq.v1
    paymentEventsDLQ: payment.events.dlq.v1
    paymentCommandsDLQ: payment.commands.dlq.v1

---
spring:
  config:
    activate:
      on-profile: msk

  kafka:
    bootstrap-servers: >
      b-2.goormmskcluster.ngtn58.c2.kafka.ap-northeast-2.amazonaws.com:9098,
      b-1.goormmskcluster.ngtn58.c2.kafka.ap-northeast-2.amazonaws.com:9098

    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: "software.amazon.msk.auth.iam.IAMLoginModule required;"
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
      # (선택) 네트워크 튜닝
      request.timeout.ms: 30000
      retry.backoff.ms: 1000

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      properties:
        linger.ms: 10

    consumer:
      group-id: module-common-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
