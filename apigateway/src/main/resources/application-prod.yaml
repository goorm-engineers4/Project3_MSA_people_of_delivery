server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
          routes:
            # Auth-Service (public)
            - id: auth-service-public
              uri: http://auth-service.app.svc.cluster.local:80
              predicates:
                - Path=/auth/login, /auth/register/**, /auth/refresh, /auth/email/send, /auth/email/verify, /.well-known/**, /api/passports/**, /internal/**
              filters:
                - RewritePath=/(?<segment>.*),/${segment}

            # Auth-Service (secured)
            - id: auth-service-secured
              uri: http://auth-service.app.svc.cluster.local:80
              predicates:
                - Path=/auth/**
              filters:
                - AuthFilter
                - RewritePath=/(?<segment>.*),/${segment}

            # User-Service
            - id: user-service
              uri: http://user-service.app.svc.cluster.local:80
              predicates:
                - Path=/users/**
              filters:
                - AuthFilter
                - RewritePath=/(?<segment>.*),/${segment}

            # Store-Service
            - id: store-service
              uri: http://store-service.app.svc.cluster.local:80
              predicates:
                - Path=/stores/**
              filters:
                - AuthFilter
                - RewritePath=/(?<segment>.*),/${segment}

            # Cart-Service
            - id: cart-service
              uri: http://cart-service.app.svc.cluster.local:80
              predicates:
                - Path=/cart/**
              filters:
                - AuthFilter
                - RewritePath=/(?<segment>.*),/${segment}

            # Payment-Service
            - id: payment-service
              uri: http://payment-service.app.svc.cluster.local:80
              predicates:
                - Path=/payment/**
              filters:
                - AuthFilter
                - RewritePath=/(?<segment>.*),/${segment}

            # AI-Service
            - id: ai-service
              uri: http://ai-service.app.svc.cluster.local:80
              predicates:
                - Path=/ai/**
              filters:
                - AuthFilter
                - RewritePath=/(?<segment>.*),/${segment}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    urls:
      - name: 인증 서비스
        url: /auth/v3/api-docs
      - name: 회원 서비스
        url: /users/v3/api-docs
      - name: 가게 서비스
        url: /stores/v3/api-docs
      - name: 주문 서비스
        url: /cart/v3/api-docs
      - name: 결제 서비스
        url: /payment/v3/api-docs
      - name: AI 서비스
        url: /ai/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  jwk-set-uri: http://auth-service.app.svc.cluster.local:80/.well-known/jwks.json
  issuer: http://auth-service
  audience: app
