spring:
  application:
    name: analytics-service
  kafka:
    streams:
      application-id: analytics-service
      properties:
        default.deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
    consumer:
      auto-offset-reset: latest
  batch:
    job:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update

kafka:
  topics:
    orderEvents: order.events.v1
    inventoryEvents: inventory.events.v1
    paymentEvents: payment.events.v1
    slaDurations: analytics.sla-durations.v1
    slaViolations: analytics.sla-violations.v1

sla:
  thresholds:
    createdToReservedMs: 600000
    reservedToAuthorizedMs: 300000
    authorizedToCommittedMs: 600000
    reservedToReleasedMs: 600000

app:
  kafka:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    prometheus:
      enabled: true
